<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <title>impact-assessment - som felt i et større skjema</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../build/alpaca/bootstrap/alpaca.css">

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.6/dist/handlebars.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="../../build/alpaca/bootstrap/alpaca.js"></script>

    <style>
        body { padding: 30px; }
        .container { max-width: 1100px; }
        pre { background: #f7f7f7; padding: 10px; max-height: 260px; overflow: auto; }
    </style>
</head>
<body>

<div class="container">

    <h1>Prosessregistrering med BIA</h1>
    <p>impact-assessment brukt som ett felt blant andre felt i et vanlig Alpaca-skjema.</p>

    <div id="process-form"></div>

    <pre id="value-output"></pre>

</div>

<script>
    var impactAssessmentStandardConfig = {
        id: "bia-standard",
        version: 1,
        categories: [
            { id: "financial", label: "Økonomi", description: "Økonomiske konsekvenser av bortfall.",
              levelDescriptions: { none: "Ingen økonomisk konsekvens.", low: "Begrensede kostnader innen ordinære rammer.",
                medium: "Merkbare kostnader som krever ekstra tiltak.", high: "Store økonomiske tap.",
                critical: "Økonomiske tap som virksomheten ikke kan akseptere." } },
            { id: "delivery", label: "Leveranser og kunder", description: "Konsekvenser for avtalte leveranser.",
              levelDescriptions: { none: "Ingen påvirkning på leveranser.", low: "Mindre forsinkelser som håndteres innen normal drift.",
                medium: "Avtalte leveranser forsinkes og krever ekstra tiltak.", high: "Kritiske leveranser stopper og rammer kunder vesentlig.",
                critical: "Langvarig stopp med uakseptable konsekvenser." } }
        ],
        durations: [
            { id: "t2h", hours: 2, label: "Etter 2 timer" },
            { id: "t8h", hours: 8, label: "Etter 8 timer" },
            { id: "t24h", hours: 24, label: "Etter 24 timer" },
            { id: "t72h", hours: 72, label: "Etter 3 døgn" }
        ],
        levels: [
            { id: "none", rank: 0, label: "Ingen", description: "Ingen konsekvens." },
            { id: "low", rank: 1, label: "Lav" },
            { id: "medium", rank: 2, label: "Moderat" },
            { id: "high", rank: 3, label: "Høy" },
            { id: "critical", rank: 4, label: "Kritisk" }
        ],
        requireAllCells: true,
        requireCommentFromLevel: "high",
        unacceptableFromLevel: "critical",
        warnOnDecreasingImpact: true
    };

    $(function() {
        $("#process-form").alpaca({
            "view": { "parent": "bootstrap-edit", "locale": "nb_NO" },
            "schema": {
                "type": "object",
                "title": "Prosessregistrering",
                "properties": {
                    "processName": {
                        "type": "string",
                        "title": "Prosessnavn",
                        "required": true
                    },
                    "processOwner": {
                        "type": "string",
                        "title": "Prosesseier"
                    },
                    "impactAssessment": {
                        "type": "impact-assessment",
                        "title": "Konsekvensanalyse (BIA)"
                    }
                }
            },
            "options": {
                "fields": {
                    "processName": {
                        "placeholder": "F.eks. Fakturering"
                    },
                    "processOwner": {
                        "placeholder": "F.eks. Økonomiavdelingen"
                    },
                    "impactAssessment": {
                        "type": "impact-assessment",
                        "config": impactAssessmentStandardConfig
                    }
                }
            },
            "data": {
                "processName": "Fakturering",
                "processOwner": "Økonomiavdelingen",
                "impactAssessment": {
                    "configId": "bia-standard",
                    "configVersion": 1,
                    "assumptions": "Fullt bortfall i normal arbeidstid, uten manuelle reservetiltak.",
                    "cells": {
                        "financial": {
                            "t2h": { "status": "assessed", "levelId": "low", "comment": "" },
                            "t8h": { "status": "assessed", "levelId": "high", "comment": "Forsinket fakturering" },
                            "t24h": { "status": "unassessed", "levelId": null, "comment": "" },
                            "t72h": { "status": "unassessed", "levelId": null, "comment": "" }
                        },
                        "delivery": {
                            "t2h": { "status": "unassessed", "levelId": null, "comment": "" },
                            "t8h": { "status": "unassessed", "levelId": null, "comment": "" },
                            "t24h": { "status": "unassessed", "levelId": null, "comment": "" },
                            "t72h": { "status": "unassessed", "levelId": null, "comment": "" }
                        }
                    }
                }
            },
            "postRender": function(control) {
                // simple submit button wired manually to keep this example minimal
                var $btn = $("<button class='btn btn-primary' style='margin-top:15px;'>Vis skjemaverdi</button>");
                $btn.on("click", function() {
                    $("#value-output").text(JSON.stringify(control.getValue(), null, 2));
                });
                $(control.getFieldEl()).after($btn);
            }
        });
    });
</script>

</body>
</html>
